{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block body %}
<div class="login card" style="max-width:460px">
  <h1>Create account / 创建账户</h1>
  <p class="hint">Your account becomes active once the GM approves it. / 总经理审批后账户生效。</p>
  {% set f = request.form %}
  <form method="post" id="register-form">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <label for="name">Full name / 姓名</label><input id="name" name="name" required value="{{ f.get('name', '') }}" autocomplete="name">
    <label for="username">Username / 用户名</label><input id="username" name="username" required minlength="3" autocapitalize="none" value="{{ f.get('username', '') }}" autocomplete="username">
    <div class="row">
      <div><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ f.get('email', '') }}" autocomplete="email"></div>
      <div><label for="phone">Phone / 电话</label><input id="phone" name="phone" type="tel" value="{{ f.get('phone', '') }}" autocomplete="tel"></div>
    </div>
    <label for="role">Role / 职位</label>
    <select id="role" name="role" required>
      {% for k, v in roles %}<option value="{{ k }}" {{ 'selected' if f.get('role') == k }}>{{ v }}</option>{% endfor %}
    </select>
    <div id="shop-wrap"><label for="shop_id">Shop / 店铺</label>
      <select id="shop_id" name="shop_id"><option value="">–</option>
        {% for s in shops %}<option value="{{ s.id }}" {{ 'selected' if f.get('shop_id') == s.id|string }}>{{ s.name }}</option>{% endfor %}
      </select></div>
    <label for="password">Password (8+ characters) / 密码</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
    <label for="confirm">Confirm password / 确认密码</label><input id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password">
    <button class="big-submit">Create account / 创建</button>
  </form>
  <p class="small"><a href="{{ url_for('login') }}">Already have an account? Sign in / 已有账户？登录</a></p>
</div>
<script>
const role = document.getElementById('role'), wrap = document.getElementById('shop-wrap');
const sync = () => { wrap.hidden = role.value !== 'manager'; document.getElementById('shop_id').required = role.value === 'manager'; };
role.addEventListener('change', sync); sync();
</script>
{% endblock %}
