{# shop + date picker used by the input forms #}
<form method="get" class="toolbar">
  {% if shops|length > 1 %}
  <div><label>{{ t('Shop') }}</label><select name="shop" onchange="this.form.submit()">
    {% for s in shops %}<option value="{{ s.id }}" {{ 'selected' if s.id == shop.id }}>{{ s.name }}</option>{% endfor %}
  </select></div>
  {% else %}<input type="hidden" name="shop" value="{{ shop.id }}">{% endif %}
  <div><label>{{ t('Date') }}</label><input type="date" name="date" value="{{ day.isoformat() }}" max="{{ today.isoformat() }}" onchange="this.form.submit()"></div>
</form>
{% if locked %}<div class="flash error">{{ t('This month is locked') }}</div>{% endif %}
