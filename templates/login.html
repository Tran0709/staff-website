{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block body %}
<div class="login card">
  <h1>AANDJ Shop Reporting</h1>
  {% if step == '2fa' %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="step" value="2fa">
    <label for="code">6-digit code from your authenticator app / 验证码</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" autofocus required>
    <button class="big-submit">Verify</button>
  </form>
  {% else %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <label for="username">Username / 用户名</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="password">Password / 密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="big-submit">Sign in / 登录</button>
  </form>
  <p class="small"><a href="{{ url_for('register') }}" id="create-account">New here? Create an account / 创建账户</a></p>
  {% endif %}
</div>
{% endblock %}
