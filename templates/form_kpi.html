{% extends "base.html" %}{% block title %}{{ t('KPIs') }}{% endblock %}
{% block body %}
<h1>{{ t('Shop-specific KPIs') }} · {{ shop.name }}</h1>
{% include "_shopdate.html" %}
<form method="post" class="card">
  <input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="shop" value="{{ shop.id }}"><input type="hidden" name="date" value="{{ day.isoformat() }}">
  <div class="row">
  {% for f in fields %}
    <div {% if f.ftype == 'text' %}style="grid-column: 1 / -1"{% endif %}>
      <label for="f{{ f.id }}">{{ f.label }}{% if f.unit %} ({{ f.unit }}){% endif %}</label>
      <input id="f{{ f.id }}" name="f{{ f.id }}" {{ 'inputmode=decimal' if f.ftype == 'number' }} value="{{ existing[f.id].value if f.id in existing else '' }}">
    </div>
  {% endfor %}
  </div>
  {% if not fields %}<p class="muted">No KPI fields set up for this shop yet.</p>{% endif %}
  <button class="big-submit" {{ 'disabled' if locked }}>{{ t('Save') }}</button>
</form>
{% endblock %}
